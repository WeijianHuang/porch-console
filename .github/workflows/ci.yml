name: frontend-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # 后端提交 api/openapi.yaml 后在此追加「重新生成无 diff」门禁（FQ-02/FQ-05）。
      - name: No secrets or real data committed
        run: |
          matches=$(git ls-files \
            | grep -v -E '(^|/)\.env\.example$' \
            | grep -E '(^|/)(\.env$|\.env\..+|.*\.pem$|.*\.key$|.*\.p12$|.*\.dump$|backups/|snapshots/|secrets/)' || true)
          if [ -n "$matches" ]; then
            echo "::error::发现疑似密钥或真实数据文件被提交："
            echo "$matches"
            exit 1
          fi
          echo "OK: no secrets or data exports tracked"
